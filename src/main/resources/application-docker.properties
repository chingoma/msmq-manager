# Docker profile - PostgreSQL and Redis from compose (Linux containers)
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/msmq_manager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:msmq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# MSMQ ops will fail on Linux (no PowerShell); queue list from DB
msmq.listener.enabled=false
