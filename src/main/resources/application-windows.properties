# Windows Container Profile (Option B: Full MSMQ Support)
# Used when running in Docker Windows containers with MSMQ installed.

# Server - align with Docker EXPOSE
server.port=${SERVER_PORT:8080}

# Database - from env (host.docker.internal or external host)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5432/msmq_manager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:msmq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis - from env
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:host.docker.internal}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# MSMQ - PowerShell available in Windows container
msmq.connection.type=POWERSHELL
msmq.connection.host=localhost
msmq.connection.port=1801

# Logging - relative to WORKDIR (C:\app)
logging.file.name=logs/msmq-manager.log
